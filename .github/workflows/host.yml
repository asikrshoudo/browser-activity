name: Native host

on:
  push:
    branches: [main]
    paths:
      - native-host/**
      - .github/workflows/host.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: native-host
          path: native-host/target/release/browser-activity-host.exe
